    <rect x="740" y="1580" width="190" height="68" rx="8" class="box"/><text x="835" y="1614" class="text">Save Approval Result</text>
    <rect x="740" y="1690" width="190" height="68" rx="8" class="box"/><text x="835" y="1724" class="text">Notify Staff of Approval</text>
    <rect x="175" y="1690" width="210" height="68" rx="8" class="box"/><text x="280" y="1724" class="text">Receive Approval Notice</text>
    <circle cx="280" cy="1848" r="28" class="box"/><circle cx="280" cy="1848" r="21" fill="none" stroke="#111" stroke-width="2"/>
    <rect x="740" y="1800" width="190" height="68" rx="8" class="box"/><text x="835" y="1834" class="text">Save Rejection Result</text>
    <rect x="560" y="1450" width="190" height="68" rx="8" class="box"/><text x="655" y="1484" class="text">Notify Staff of Rejection</text>
    <rect x="170" y="1480" width="220" height="68" rx="8" class="box"/><text x="280" y="1514" class="text">Receive Rejection Reason</text>
