<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1980" viewBox="0 0 1700 1980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .title{font:700 22px Arial,sans-serif;fill:#111}
      .lane{font:700 16px Arial,sans-serif;fill:#111}
      .box{fill:#fff;stroke:#111;stroke-width:1.5}
      .text{font:13px Arial,sans-serif;fill:#111;text-anchor:middle;dominant-baseline:middle}
      .label{font:700 12px Arial,sans-serif;fill:#111}
      .flow{fill:none;stroke:#333;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1700" height="1980" fill="#fff"/>
  <text x="850" y="45" class="title" text-anchor="middle">Staff Tour Creation, Schedule Preparation and Approval Business Process</text>
  <rect x="20" y="80" width="520" height="1840" fill="#fff" stroke="#666"/>
  <rect x="540" y="80" width="600" height="1840" fill="#fff" stroke="#666"/>
  <rect x="1140" y="80" width="520" height="1840" fill="#fff" stroke="#666"/>
  <text x="280" y="105" class="lane" text-anchor="middle">Staff</text>
  <text x="840" y="105" class="lane" text-anchor="middle">System</text>
  <text x="1400" y="105" class="lane" text-anchor="middle">Admin</text>

